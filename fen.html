rünen aydınlık alan azalır."],"matchCorrect":5},{"code":"FB.5.1.4","q":"Üç topun hacimleri büyükten küçüğe 800, 80 ve 20 birim olarak verilmiştir. Yalnızca hacim sırasını temsil eden Güneş–Dünya–Ay modelinde bu topları eşleştiriniz. Bu sayılar gerçek hacim oranları mıdır?","answer":"800 birimlik top Güneş’i, 80 birimlik top Dünya’yı, 20 birimlik top Ay’ı temsil eder. Bunlar yalnızca sıralamayı göstermek için verilmiştir; gerçek hacim oranı olarak alınamaz.","rubric":["800=Güneş, 80=Dünya, 20=Ay eşleştirmesini yapar.","Verilen sayıların gerçek hacim oranları olmadığını belirtir."],"mc":"Hacimleri 800, 80 ve 20 birim olan toplar sıralama modeli için nasıl eşleştirilir?","options":["Doğru","Yanlış"],"visual":"","id":"tf-6-7","points":14,"difficulty":"Orta","correct":1,"context":"Sıralama maketi için hacimleri 800, 80 ve 20 birim olan üç top hazırlanmış. Kutuda ‘Sayılar gerçek hacim oranlarını vermez’ notu bulunuyor. Öğrenciler etiketleri yalnızca büyükten küçüğe sıralayacak.","contextTitle":"Modeli geliştirme","skill":"Tasarım yenileme","fill":"80 birimlik top ________ temsil etmelidir.","accepted":["Dünya’yı","Dünyayı","Dünya"],"claim":"800:80:20 sayıları bu açıklamaya rağmen gerçek Güneş–Dünya–Ay hacim oranı olarak kullanılabilir.","truth":false,"matchOptions":["1","İlk dördünde sağ, son dördünde sol yarı aydınlıktır.","Evrelerin yaklaşık aylık bir döngü oluşturduğunu","İkisi de saat yönünün tersidir.","800: Güneş / 80: Dünya / 20: Ay","Cismin kendi ekseni çevresine çizilen küçük dönme oku","Son dördünden geçer ve görünen aydınlık alan azalır."],"matchCorrect":4}]},{"id":"tf-7","mode":"tf","no":7,"name":"Bilimsel Kontrol","questions":[{"code":"FB.5.1.2","q":"İki bilgi kartı var: “Ay kendi ekseni çevresinde hareket eder.” ve “Ay Dünya çevresinde hareket eder.” Her karta doğru hareket adını veriniz; bu hareketlerin aynı anlarda gerçekleşip gerçekleşemeyeceğini açıklayınız.","answer":"Birinci kart dönme, ikinci kart dolanmadır. Ay bu iki hareketi aynı zamanda gerçekleşt ylüyor. Yüzey görüntülerinde çok sayıda çarpma çukuru seçiliyor. Ekip bu iki veriyi birlikte yorumluyor.","contextTitle":"Deney / inceleme","skill":"Bilimsel açıklama","fill":"Yüzeye ulaşan gök cisimlerinin çarpmasıyla oluşabilen çukurların adı ________ olur.","accepted":["krater","kraterler"],"claim":"Çok ince gaz örtüsü, yüzeye ulaşan gök cisimleriyle oluşan kraterleri açıklamada dikkate alınabilir.","truth":true,"matchOptions":["Dünya Güneş çevresinde ilerlerken Ay’ın Dünya çevresinde dolanması","İkisini aynı zamanda gerçekleştirebilir.","Gök cisimleri yüzeye daha kolay ulaşıp çarpma kraterleri oluşturabilir.","Topun konumu gölgeden çıkacak şekilde ayarlanmalıdır.","İlk dördün","Büyüklük sırası ve doğru merkezler çevresindeki dolanma okları","Dünya’dan bakınca Güneş yönündedir; Dünya’ya dönük yüzü karanlıktır."],"matchCorrect":2},{"code":"FB.5.1.3","q":"Bir öğrenci evre kartlarını “yeni ay → dolunay → ilk dördün → son dördün” diye sıralamış. Yanlışlığı belirtip doğru ana evre dizisini yazınız.","answer":"İlk dördün dolunaydan önce gelmelidir. Doğru sıra yeni ay → ilk dördün → dolunay → son dördündür.","rubric":["İlk dördün ile dolunayın sırasının yanlış olduğunu belirler.","Dört ana evreyi doğru sırada yeniden yazar."],"mc":"Yeni aydan sonraki ilk ana evre hangisidir?","options":["Doğru","Yanlış"],"visual":"","id":"tf-7-3","points":14,"difficulty":"Orta","correct":1,"context":"Bir öğrenci yeni ay → dolunay → ilk dördün → son dördün sırasını panoya asıyor. Kontrol ekibi ilk iki geçişin gözlem sırasıyla uyuşmadığını belirtiyor.","contextTitle":"Takvim ve sıralama","skill":"Sıralama ve tahmin","fill":"Yeni aydan hemen sonraki ana evre kartı ________ olmalıdır.","accepted":["ilk dördün"],"claim":"Panodaki ana evre sırası düzeltilmeden kullanılabilir.","truth":false,"matchOptions":["Dünya Güneş çevresinde ilerlerken Ay’ın Dünya çevresinde dolanması","İkisini aynı zamanda gerçekleştirebilir.","Gök cisimleri yüzeye daha kolay ulaşıp çarpma kraterleri oluşturabilir.","Topun konumu gölgeden çıkacak şekilde ayarlanmalıdır.","İlk dördün","Büyüklük sırası ve doğru merkezler çevresindeki dolanma okları","Dünya’dan bakınca Güneş yönündedir; Dünya’ya dönük yüzü karanlıktır."],"matchCorrect":4},{"code":"FB.5.1.3","q":"Bir modelde lamba Güneş’i temsil ediyor ama gözlemcinin gölgesi topu örtüyor. Normal evreleri inceleyebilmek için düzenekte neyi değiştirirsiniz? Gerekçenizi yazınız.","answer":"Top, gözlemcinin gölgesine girmeyecek kadar yukarıda veya uygun bir düzlemde tutulmalıdır. Normal evreler gölgelenmeden değil, aydınlık bölümün farklı görünmesinden kaynaklanır.","rubric":["Topu gözlemcinin gölgesinden çıkaracak uygun düzenleme önerir.","Gölgeyle örtülmeyi normal evre oluşumundan ayırır."],"mc":"Normal evre modelinde gözlemcinin gölgesi topu örtüyorsa ne yapılmalıdır?","options":["Doğru","Yanlış"],"visual":"","id":"tf-7-4","points":14,"difficulty":"Orta","correct":0,"context":"Lamba–top deneyinde gözlemcinin başının gölgesi topu kapatıyor. Grup, bu kararmayı her normal evrenin nedeni diye yorumluyor. Diğer grup topu biraz yükselterek gölgenin dışında tutmayı öneriyor.","contextTitle":"Düzenek ve veri","skill":"Model değerlendirme","fill":"Normal evre modelini incelemek için top gözlemcinin ________ dışına çıkarılmalıdır.","accepted":["gölgesinin","gölge"],"claim":"Topu gölgeden çıkarmak, normal evrelerle tutulmaya benzer gölgelenmeyi karıştırmayı önler.","truth":true,"matchOptions":["Dünya Güneş çevresinde ilerlerken Ay’ın Dünya çevresinde dolanması","İkisini aynı zamanda gerçekleştirebilir.","Gök cisimleri yüzeye daha kolay ulaşıp çarpma kraterleri oluşturabilir.","Topun konumu gölgeden çıkacak şekilde ayarlanmalıdır.","İlk dördün","Büyüklük sırası ve doğru merkezler çevresindeki dolanma okları","Dünya’dan bakınca Güneş yönündedir; Dünya’ya dönük yüzü karanlıktır."],"matchCorrect":3},{"code":"FB.5.1.3","q":"Yeni ay evresinde lamba, top ve gözlemci arasındaki göreli konum nasıl olmalıdır? Dünya’ya dönük top yüzünün görünüşünü de açıkl const MODE_NAMES={open:'Açık uçlu',test:'Çoktan seçmeli',fill:'Boşluk doldurma',tf:'Doğru–yanlış',match:'Eşleştirme'};
function modeLabel(m){return MODE_NAMES[m]||m;}
function normalizeAnswer(s){return String(s??'').normalize('NFKC').toLocaleLowerCase('tr-TR').replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[’'.,!?;:]/g,'').replace(/\s+/g,' ').trim();}
function questionPrompt(e,q){if(e.mode==='fill')return q.fill;if(e.mode==='tf')return 'Bağlamdaki kanıtları ve bilimsel bilgilerinizi kullanarak şu iddiayı değerlendiriniz: '+q.claim;if(e.mode==='match')return 'Bu bağlamın bilimsel açıklamasını ortak çıkarım havuzundan seçiniz. Her açıklamayı yalnızca bir bağlamla eşleştiriniz.';return e.mode==='open'?q.q:q.mc;}
function contextHTML(q){return `<div class="contextbox"><span class="contexttitle">${esc(q.contextTitle||'BAĞLAM / KANIT')}</span><p>${esc(q.context||'')}</p><small>${esc(q.skill||'Kanıt yorumlama')}</small></div>`;}
function responseText(e,q,a){if(e.mode==='open'||e.mode==='fill')return a.text||'(Boş)';return a.choice===null?'(Seçenek işaretlenmedi.)':q.options[a.choice]||'(Geçersiz seçenek)';}
function correctText(e,q){return e.mode==='fill'?q.accepted.join(' / '):e.mode==='open'?q.answer:q.options[q.correct];}
function correctAnswer(e,q,a){return e.mode==='fill'?q.accepted.some(t=>normalizeAnswer(t)===normalizeAnswer(a.text)):a.choice===q.correct;}
function autoInput(e,q,a,i){
 if(e.mode==='fill')return `<label for="response" class="field">Boşluğa uygun kavramı yazınız.</label><input id="response" type="text" maxlength="120" autocomplete="off" value="${esc(a.text)}" placeholder="Kavram / kısa ifade…"><p class="muted">Büyük/küçük harf ve Türkçe karakter farkları normalleştirilir; yalnızca tanımlı alternatifler kabul edilir. Bu alan yapay zekâ ile anlam değerlendirmesi yapmaz.</p>`;
 if(e.mode==='match')return `<label for="matchChoice" class="field">Ortak çıkarım havuzu · 7 bağlam / 7 açıklama</label><select id="matchChoice" name="choice"><option value="" disabled ${a.choice===null?'selected':''}>Açıklama seçiniz…</option>${q.options.map((o,k)=>`<option value="${k}" ${a.choice===k?'selected':''} ${active.answers.some((x,j)=>j!==i&&x.choice===k)?'disabled':''}>${String.fromCharCode(65+k)}) ${esc(o)}</option>`).join('')}</select><p class="muted">Başka bir bağlamla eşleştirdiğiniz açıklamalar devre dışıdır. Bir eşleştirmeyi değiştirmek için önce ilgili sorudaki seçimi kaldırabilirsiniz.</p><button data-act="clearChoice">Eşleştirmeyi kaldır</button><details><summary>Yedi bağlamı birlikte incele</summary>${examOf(active).questions.map((x,j)=>`<p><strong>${j+1}.</strong> ${esc(x.context)}</p>`).join('')}</details>`;
 return `<fieldset style="border:0;padding:0;margin:0"><legend class="muted">${e.mode==='tf'?'İddia doğru mu, yanlış mı?':'Bir seçenek işaretleyiniz.'}</legend>${q.options.map((o,k)=>`<label class="option ${a.choice===k?'chosen':''}"><input type="radio" name="choice" value="${k}" ${a.choice===k?'checked':''}><span>${e.mode==='test'?`<span class="letter">${'ABCD'[k]})</span> `:''}${esc(o)}</span></label>`).join('')}</fieldset><button data-act="clearChoice">Seçimi kaldır</button>`;
}

function showExam(){if(!active)return;currentPage='exam';setNav('');const e=examOf(active),i=active.pos,q=e.questions[i],a=active.answers[i],n=active.answers.filter(answered).length;draw=null;drawUndo=[];$('app').innerHTML=`<div class="row between" style="margin-bottom:18px"><div><span class="tag">${modeLabel(e.mode)} · ${active.kind==='exam'?'Sınav':'Alıştırma'}</span><h2 style="margin-top:9px">${esc(e.name)}</h2></div><button data-act="page" data-target="home">Kaydet ve kütüphaneye dön</button></div><div class="layout"><section class="card"><div class="row between"><span class="tag">SORU ${i+1} / 7</span><div class="row"><span class="tag teal">${q.points} puan</span><span class="muted" style="font-size:.8rem">${q.code}</span></div></div>${contextHTML(q)}<p class="question">${esc(questionPrompt(e,q))}</p>${q.visual==='halves'?halves():''}${e.mode==='open'?`<label for="response" class="muted">Yanıtınız · açıklama ve gerekçenizi yazınız</label><textarea id="response" maxlength="20000" placeholder="Düşüncenizi kendi cümlelerinizle açıklayın…">${esc(a.text)}</textarea>${q.code!=='FB.5.1.2'||q.visual==='blank'?`<section class="drawing"><div class="row between"><span class="muted">Model / çizim alanı · isteğe bağlı</span><small>Yazı, ok ve şekil çizebilirsiniz</small></div><div class="drawtools"><label>Kalem <input id="penColor" type="color" value="#263a65" aria-label="Kalem rengi"></label><label>Kalınlık <select id="penWidth" style="width:65px;padding:4px"><option>2</option><option selected>4</option><option>7</option></select></label><button data-act="undoDraw">Geri al</button><button data-act="clearDraw">Temizle</button></div><canvas id="drawingCanvas" width="900" height="330" aria-label="Serbest model çizim alanı"></canvas><small>Dokunmatik ekran veya fareyle çizim yapılır. Klavye kullanıcıları modeli yukarıdaki metin alanında açıklayabilir.</small></section>`:''}`:autoInput(e,q,a,i)}${active.kind==='practice'?`<details><summary>Çalışma ipucunu aç</summary><p>${esc(c function updateAnswerUI(){if(!active)return;let n=active.answers.filter(answered).length;if($('answerCount'))$('answerCount').textContent=n+' / 7 soru yanıtlandı';if($('answerProgress'))$('answerProgress').value=n;document.querySelectorAll('[data-act="goto"]').forEach(b=>b.classList.toggle('done',answered(active.answers[Number(b.dataset.index)])));if($('saveState'))$('saveState').textContent=storageOK?'Kaydedildi · '+new Date().toLocaleTimeString('tr-TR'):'Kayıt yapılamadı; JSON yedeği alın.'}

function initDraw(data){const canvas=$('drawingCanvas'),ctx=canvas.getContext('2d');draw={canvas,ctx,on:false,changed:false};ctx.lineCap='round';ctx.lineJoin='round';if(data){let image=new Image();image.onload=()=>{if(draw&&draw.canvas===canvas){ctx.clearRect(0,0,900,330);ctx.drawImage(image,0,0);canvas.style.pointerEvents='auto'}};canvas.style.pointerEvents='none';image.src=data}const xy=e=>{let b=canvas.getBoundingClientRect();return[(e.clientX-b.left)*900/b.width,(e.clientY-b.top)*330/b.height]};canvas.addEventListener('pointerdown',e=>{if(!active)return;e.preventDefault();drawUndo.push(canvas.toDataURL());if(drawUndo.length>15)drawUndo.shift();draw.on=true;draw.changed=false;canvas.setPointerCapture(e.pointerId);let [x,y]=xy(e);ctx.strokeStyle=$('penColor').value;ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=Number($('penWidth').value);ctx.beginPath();ctx.arc(x,y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x,y);draw.changed=true});canvas.addEventListener('pointermove',e=>{if(!draw||!draw.on)return;let[x,y]=xy(e);ctx.lineTo(x,y);ctx.stroke()});const end=()=>{if(!draw||!draw.on)return;draw.on=false;if(active){active.answers[active.pos].drawing=canvas.toDataURL('image/png');persist();updateAnswerUI()}};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end)}
function clearDraw(){if(!draw||!active)return;if(!window.confirm('Bu sorunun çizimi temizlensin mi?'))return;drawUndo.push(draw.canvas.toDataURL());draw.ctx.clearRect(0,0,900,330);active.answers[active.pos].drawing='';persist();updateAnswerUI()}
function undoDraw(){if(!draw||!active||!drawUndo.length)return;let data=drawUndo.pop(),image=new Image(),target=draw,record=active,index=active.pos;image.onload=()=>{if(draw!==target||active!==record||active.pos!==index)return;target.ctx.clearRect(0,0,900,330);target.ctx.drawImage(image,0,0);let px=target.ctx.getImageData(0,0,900,330).data,has=false;for(let k=3;k<px.length;k+=4)if(px[k]){has=true;break}record.answers[index].drawing=has?data:'';persist();updateAnswerUI()};image.src=data}

function result(id){const r=getRecord(id);if(!r)return;currentPage='result';setNav('records');let e=examOf(r),waiting=r.marks.filter(m=>m===null).length;let status=e.mode!=='open'?'Otomatik sınav sonucu':r.confirmed?'Öğretmen onaylandı olarak işaretlendi':waiting?waiting+' soru puanlama bekliyor':'Puanlandı · öğretmen onayı bekliyor';$('app').innerHTML=`<section class="card resulthead"><div><span class="tag ${r.confirmed?'good':'amber'}">${esc(status)}</span><h2 style="margin-top:12px">${esc(e.name)} · Sonuç ve çözümler</h2><p class="muted">${esc(r.student.name)} · ${esc(r.student.group)} · ${new Date(r.created).toLocaleString('tr-TR')} · ${Math.floor(r.elapsed/60)} dk ${r.elapsed%60} sn</p></div><div style="text-align:right"><div class="score">${waiting?'—':total(r).toFixed(1).replace('.0','')}<small style="font-size:1rem"> / 100</small></div><small>${waiting?'Puanlanan soruların ara toplamı: '+total(r):'7 soru · 3 öğrenme çıktısı'}</small></div></section>${e.mode==='open'?`<div class="notice warning">Açık uçlu değerlendirme otomatik anlam analizi değildir. Yanıtı ve çizimi okuyun; eş anlamlı doğru açıklamaları kabul edin. Her soruda ölçütleri işaretleyip puanı kaydedin. Bu yerel sistemde “öğretmen onayı” kimlik doğrulamalı değildir; yalnızca kayıt durumudur.</div>`:''}<div class="row" style="margin:18px 0"><button data-act="printresult" data-id="${r.id}">Sonuç raporunu yazdır / PDF</button><button data-act="printkey" data-id="${e.id}">Cevap anahtarı</button><button data-act="exportOne" data-id="${r.id}">Bu oturumu yedekle</button>${e.mode==='open'?`<button class="primary" data-act="confirmMarks" data-id="${r.id}" ${waiting?'disabled':''}>Öğretmen onayını işaretle</button>`:''}<button data-act="page" data-target="records">Kayıtlara dön</button></div><section class="card"><h3>Öğrenme çıktısı analizi</h3><div class="tablewrap"><table><thead><tr><th>Öğrenme çıktısı</th><th>Soru</th><th>Puan</th><th>Durum</th></tr></thead><tbody>${Object.keys(codes).map(c=>{let ii=e.qu function saveMark(id,i){let r=getRecord(id),q=examOf(r).questions[i],n=Number($('mark-'+i).value);if(!Number.isFinite(n)||n<0||n>q.points){notify('Geçerli puan aralığı: 0–'+q.points);return}r.marks[i]=Math.round(n*2)/2;r.criteria[i]=[...document.querySelectorAll(`[data-index="${i}"][data-criterion]`)].map(x=>x.checked);r.confirmed=false;persist();let y=window.scrollY;result(id);window.scrollTo(0,y);notify('Soru '+(i+1)+' puanı kaydedildi.')}

async function importData(file){if(!file)return;if(file.size>25000000){notify('Yedek 25 MB sınırını aşıyor.');return}try{let s=JSON.parse(await file.text());if(s.schema!=='ay-atolyesi-1'||!Array.isArray(s.records)||!s.records.every(validRecord))throw Error('Dosyanın biçimi veya kayıtları geçersiz.');if(s.records.filter(r=>r.status==='active').length>1)throw Error('Yedekte birden fazla açık oturum var.');if(active&&s.records.some(r=>r.status==='active'&&r.id!==active.id))throw Error('Önce mevcut açık oturumu bitirin.');if(!confirm(s.records.length+' kayıt içe aktarılsın mı? Aynı kimlikli kayıtlar yedekteki sürümle değişir.'))return;let by=new Map(store.records.map(r=>[r.id,r]));s.records.forEach(r=>by.set(r.id,r));let merged=[...by.values()];if(merged.filter(r=>r.status==='active').length>1)throw Error('İçe aktarma birden fazla açık oturum oluşturuyor.');store.records=merged.sort((a,b)=>b.created-a.created);active=store.records.find(r=>r.status==='active')||null;persist();page('records');notify('Yedek içe aktarıldı.')}catch(e){notify('İçe aktarılamadı: '+e.message)}}

function lab(){currentPage='lab';$('app').innerHTML=`<div class="row between"><div><span class="tag">KEŞİF ALANI · SINAV DIŞI</span><h2 style="margin-top:10px">Ay ve model laboratuvarı</h2></div><button data-act="page" data-target="home">Sınavlara dön</button></div><div class="notice">Model öğretim amaçlıdır: boyutlar, uzaklıklar ve hareket hızları ölçekli değildir. Evre geometrisini göstermek için Dünya–Ay doğrultusu değiştirilir; Dünya’nın aylık ilerleyişi çizilmez. Tutulmalar gösterilmez; düzlem şeması her yeni/dolunayda tutulma olacağı anlamına gelmez.</div><div class="labgrid"><section class="card"><h3>Uzaydan konum · kuzey tarafından bakış</h3><canvas id="orbitCanvas" width="760" height="490" class="labcanvas" aria-label="Ay’ın Dünya çevresindeki göreli konumu"></canvas><label for="phaseRange">Evre döngüsünü değiştiriniz</label><input id="phaseRange" class="range" type="range" min="0" max="1000" value="${Math.round(labP*1000)}"><div class="row between"><small>0 → yaklaşık 29,5 günlük görünüş döngüsü</small><button data-act="animateLab" id="animateButton">▶ Oynat</button></div><div class="stepbuttons">${phaseNames.map((n,i)=>`<button data-act="phaseStep" data-index="${i}">${n}</button>`).join('')}</div></section><section class="card"><h3>Dünya’dan görünüş</h3><div style="display:flex;justify-content:center;margin:22px"><canvas id="phaseCanvas" width="200" height="200" class="phasecanvas" aria-label="Dünya’dan görülen Ay’ın aydınlık bölümü"></canvas></div><h2 id="phaseName" style="text-align:center"></h2><p id="phaseInfo" style="text-align:center" class="muted" aria-live="polite"></p><div class="notice">Ay kendi ışığını üretmez. Normal evre modelinde Güneş Ay’ın yaklaşık yarısını aydınlatır; biz bu aydınlık yarının değişen bir bölümünü görürüz.</div><p class="muted">Turuncu işaret Ay’ın Dünya’ya dönük tarafını izler. Ay yer değiştirirken işaretin uzaya göre yönü de döner. Bu, “Ay hiç dönmez” yanılgısını düzeltmeye yardımcı olur.</p><small>Sağ/sol aydınlık görünüşü Türkiye ve kuzey yarımküre için standart yönlendirmeyle gösterilmiştir. Gerçek gökyüzündeki eğim değişebilir.</small></section></div><section class="card" style="margin-top:20px"><h3>Büyüklük sırası ≠ tam ölçek</h3><p>Hacimsel büyüklük sırası Güneş &gt; Dünya &gt; Ay’dır. Modelde bu sıranın korunması önemlidir; topların ve aralarındaki uzaklıkların tam ölçekli olması ayrı bir koşuldur.</p><div class="notice warning">Bir dönme ve Dünya çevresinde bir dolanma yaklaşık 27,3 gündür; aynı evreye dönüş yaklaşık 29,5 gündür. Bu iki süre aynı değildir. Buradaki sürgü bir gerçek zaman/yörünge simülasyonu değil, evre geometrisi modelidir.</div></section>`;paintLab()}

diskin yaklaşık %'+pct+' kadarı aydınlık · döngüde '+(p*29.5).toFixed(1).replace('.',',')+'. gün';$('phaseRange').value=Math.round(p*1000)}

function motionLab(){currentPage='motion';setNav('motion');const t=motion.time;const earthOrbit=2*Math.PI*t,moonOrbit=2*Math.PI*t,sunSpin=2*Math.PI*t*4,earthSpin=2*Math.PI*t*8,moonSpin=2*Math.PI*t;const sunAngle=(sunSpin%(2*Math.PI)),earthAngle=(earthSpin%(2*Math.PI)),moonAngle=(moonSpin%(2*Math.PI));const ex=330+225*Math.cos(earthOrbit),ey=250-225*Math.sin(earthOrbit),mx=ex+68*Math.cos(moonOrbit),my=ey-68*Math.sin(moonOrbit);$('app').innerHTML=`<div class="row between"><div><span class="tag">HAREKET MODELİ · SINAV DIŞI</span><h2 style="margin-top:10px">Güneş · Dünya · Ay dönme ve dolanma modeli</h2></div><button data-act="page" data-target="home">Sınavlara dön</button></div><div class="notice">Bu model, üç cismin hareket ilişkisini gösterir. Boyutlar, uzaklıklar ve hızlar gerçek ölçüde değildir. Dönme, cismin kendi ekseni çevresindeki hareketi; dolanma ise başka bir gök cismi çevresindeki hareketidir.</div><div class="row" style="margin:14px 0"><button class="${motion.tab!=='motion'?'selected':''}" data-act="labTab" data-tab="phase">Ay evreleri</button><button class="${motion.tab==='motion'?'selected':''}" data-act="labTab" data-tab="motion">Dönme–dolanma modeli</button></div><section class="card"><div class="labgrid"><div><h3>Uzaydan görünüş · kuzey tarafından bakış</h3><canvas id="motionCanvas" width="760" height="500" class="labcanvas" aria-label="Güneş, Dünya ve Ay’ın dönme ve dolanma modeli"></canvas><div class="row between" style="margin-top:12px"><small id="motionStatus"></small><div class="row"><button data-act="motionStep">+Adım</button><button data-act="motionReset">Sıfırla</button><button data-act="motionPlay" id="motionPlayButton">${motion.running?'Ⅱ Durdur':'▶ Oynat'}</button></div></div><label for="motionSpeed">Hız · ${motion.speed.toFixed(1)}×</label><input id="motionSpeed" class="range" type="range" min="0.2" max="4" step="0.2" value="${motion.speed}"></div><div><h3>Hareket kontrolü</h3><div class="legend"><span><i style="background:#f9d47d"></i>Güneş</span><span><i style="background:#60bec6"></i>Dünya</span><span><i style="background:#dce4ff"></i>Ay</span><span><i style="background:#ff926d"></i>Dönme oku</span><span><i style="background:#b7a6ff"></i>Dolanma oku</span></div><div class="toggles">${[['showSunSpin','Güneş dönmesi',motion.showSunSpin],['showEarthSpin','Dünya dönmesi',motion.showEarthSpin],['showEarthOrbit','Dünya dolanması',motion.showEarthOrbit],['showMoonSpin','Ay dönmesi',motion.showMoonSpin],['showMoonOrbit','Ay dolanması',motion.showMoonOrbit]].map(([id,label,on])=>`<label class="option"><input type="checkbox" id="${id}" data-act="toggleMotion" data-target="${id}" ${on?'checked':''}><span>${label}</span></label>`).join('')}</div><div class="notice"><strong>Dünya:</strong> kendi ekseninde döner ve Güneş çevresinde dolanır.<br><strong>Ay:</strong> kendi ekseninde döner, Dünya çevresinde dolanır ve Dünya ile birlikte Güneş çevresinde ilerler.<br><strong>Güneş:</strong> kendi ekseninde döner; modelde Dünya veya Ay çevresinde dolanmaz.</div><div class="notice warning">Bu animasyonda Ay’ın dönmesi, Dünya çevresindeki dolanmasıyla eşit hızda gösterilir. Bu, Dünya’dan genel olarak aynı yüzün görülmesini temsil eder. Gerçek süreler yaklaşık 27,3 gündür; aynı evreye dönüş yaklaşık 29,5 gündür.</div></div></div></section>`;paintMotion()}
function arrow(ctx,x1,y1,x2,y2,color,width=3){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const ang=Math.atan2(y2-y1,x2-x1),head=10;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(ang-.42),y2-head*Math.sin(ang-.42));ctx.lineTo(x2-head*Math.cos(ang+.42),y2-head*Math.sin(ang+.42));ctx.closePath();ctx.fill()}
function paintMotion(){const c=$('motionCanvas');if(!c)return;const ctx=c.getContext('2d'),t=motion.time,eo=2*Math.PI*t,mo=2*Math.PI*t,ss=2*Math.PI*t*4,es=2*Math.PI*t*8,ms=2*Math.PI*t;const ex=330+225*Math.cos(eo),ey=250-225*Math.sin(eo),mx=ex+68*Math.cos(mo),my=ey-68*Math.sin(mo);ctx.clearRect(0,0,760,500);ctx.fillStyle='#111a34';ctx.fillRect(0,0,760,500);if(motion.showEarthOrbit){ctx.strokeStyle='#b7a6ff';ctx.lineWidth=2;ctx.setLineDash([7,8]);ctx.beginPath();ctx.arc(330,250,225,0,2*Math.PI);ctx.stroke();ctx.setLineDash([]);arrow(ctx,330+225*Math.cos(eo-.16),250-225*Math.sin(eo-.16),ex,ey,'#b7a6ff',3)}
if(motion.showMoonOrbit){ctx.strokeStyle='#8f9fd8';ctx.lineWidth=2;ctx.setLineDash([5,6]);ctx.beginPath();ctx.arc(ex,ey,68,0,2*Math.PI);ctx.stroke();ctx.setLineDash([]);arrow(ctx,ex+68*Math.cos(mo-.2),ey-68*Math.sin(mo-.2),mx,my,'#8f9fd8',2)}
ctx.fillStyle='#f9d47d';ctx.beginPath();ctx.arc(330,250,48,0,2*Math.PI);ctx.fill();ctx.fillStyle='#7a5b13';ctx.beginPath();ctx.arc(330,250,48,ss,ss+Math.PI/2);ctx.fill();ctx.fillStyle='#fff';ctx.font='17px system-ui';ctx.fillText('Güneş',303,318);if(motion.showSunSpin){arrow(ctx,330+58*Math.cos(ss),250-58*Math.sin(ss),330+58*Math.cos(ss+.42),250-58*Math.sin(ss+.42),'#ff926d',4)}
ctx.fillStyle='#60bec6';ctx.beginPath();ctx.arc(ex,ey,27,0,2*Math.PI);ctx.fill();ctx.fillStyle='#0d2b34';ctx.beginPath();ctx.arc(ex,ey,27,es,es+Math.PI/2);ctx.fill();ctx.fillStyle='#fff';ctx.fillText('Dünya',ex-28,ey+48);if(motion.showEarthSpin){arrow(ctx,ex+38*Math.cos(es),ey-38*Math.sin(es),ex+38*Math.cos(es+.42),ey-38*Math.sin(es+.42),'#ff926d',4)}
ctx.fillStyle='#dce4ff';ctx.beginPath();ctx.arc(mx,my,15,0,2*Math.PI);ctx.fill();ctx.fillStyle='#5a4a2f';ctx.beginPath();ctx.arc(mx,my,15,ms,ms+Math.PI/2);ctx.fill();ctx.fillStyle='#fff';ctx.fillText('Ay',mx-10,my-25);if(motion.showMoonSpin){arrow(ctx,mx+22*Math.cos(ms),my-22*Math.sin(ms),mx+22*Math.cos(ms+.42),my-22*Math.sin(ms+.42),'#ff926d',3)}
ctx.font='13px system-ui';ctx.fillStyle='#c9d2f5';ctx.fillText('Kuzey tarafından bakış · yönler temsilîdir',20,480);ctx.fillStyle='#b7a6ff';ctx.fillText('Mor: Dünya’nın Güneş çevresinde dolanması',20,456);ctx.fillStyle='#8f9fd8';ctx.fillText('Mavi: Ay’ın Dünya çevresinde dolanması',20,440);ctx.fillStyle='#ff926d';ctx.fillText('Turuncu: kendi eksenindeki dönüş',20,424);const pct=Math.round(t*100);$('motionStatus').textContent=`İlerleme: %${pct} · Dünya dolanması: %${pct} · Ay dolanması: %${pct} · Ay’ın Dünya’ya dönük yüzü değişmiyor`}

function research(){currentPage='research';$('app').innerHTML=`<span class="tag">ARAŞTIRMA VE KAPSAM</span><h2 style="margin-top:14px">Müfredattan sınav tasarımına</h2><section class="card"><h3>5. sınıf programının çerçevesi</h3><p>Resmî TYMM 5. sınıf Fen Bilimleri programı yedi üniteden oluşur: Gökyüzündeki Komşularımız ve Biz; Kuvveti Tanıyalım; Canlıların Yapısına Yolculuk; Işığın Dünyası; Maddenin Doğası; Yaşamımızdaki Elektrik; Sürdürülebilir Yaşam ve Geri Dönüşüm.</p><p>Bu uygulama tam yıl programının sınav sistemi değildir. Yüklenen Senaryo 2 ile sınırlıdır. Birinci ünitenin Güneş’in yapısı ve dönmesiyle ilgili FB.5.1.1 çıktısı bu tabloda bulunmadığından bağımsız bir soru alanı yapılmamıştır. Güneş, diğer çıktılarda ışık kaynağı ve model bileşeni olarak yer alır.</p><p>Birinci ünite programda 20 ders saatidir. Öne çıkan alan becerileri bilimsel çıkarım yapma ve bilimsel model oluşturmadır. Bilgi toplama, veri kaydetme, yorumlama, model önerme ve kanıta göre yenileme süreçleri birlikte değerlendirilmelidir.</p><p><a href="https://tymm.meb.gov.tr/ogretim-programlari/fen-bilimleri-dersi/6" target="_blank" rel="noopener">MEB · 5. sınıfın yedi ünitesi ↗</a> · <a href="https://tymm.meb.gov.tr/fen-bilimleri-dersi/unite/367" target="_blank" rel="noopener">MEB · 1. ünitenin ayrıntılı resmî programı ↗</a></p></section><section class="card" style="margin-top:20px"><h3>Yüklenen Senaryo 2’ye birebir soru dağılımı</h3><div class="tablewrap"><table><thead><tr><th>Öğrenme çıktısı</th><th>Soru</th><th>Puan</th><th>Uygulama yaklaşımı</th></tr></thead><tbody><tr><td>FB.5.1.2 · Ay’ın özellikleri, dönme ve dolanma hareketleri ile ilgili bilimsel çıkarım yapabilme</td><td>1–2 · 2 soru</td><td>28</td><td>Özellik tanımlama, gözlem/veri yorumlama, hareket ve aynı yüz ilişkisi</td></tr><tr><td>FB.5.1.3 · Ay’ın evrelerini temsil eden bilimsel model oluşturabilme</td><td>3–5 · 3 soru</td><td>44</td><td>Evre sırası, gözlem kaydı, model önerme, model hatasını kanıtla düzeltme</td></tr><tr><td>FB.5.1.4 · Güneş, Dünya ve Ay’ın birbirlerine göre hareketlerini ve hacimsel büyüklüklerini temsil eden bilimsel model oluşturabilme</td><td>6–7 · 2 soru</td><td>28</td><td>Büyüklük ve hareket temsili, ok ve etiket, model sınırlılıkları ve yenileme</td></tr></tbody></table></div><p>Her sınavdaki puanlar sırasıyla 14, 14, 14, 14, 16, 14 ve 14’tür. Bu puan dağılımı uygulama tasarımıdır; yüklediğiniz tablo yalnızca soru sayılarını belirler.</p></section><div class="twocol" style="margin-top:20px"><section class="card"><h3>Ölçme yaklaşımı ve sınırlar</h3><ul><li>Açık uçlu sorularda açıklama, gözlem verisinden sonuç çıkarma, temsil çizme ve hatalı modeli düzeltme birlikte kullanılır.</li><li>FB.5.1.3 ve FB.5.1.4 sorularındaki çizim alanı metinle açıklamayı tamamlar. Her soru tek başına bütün model kurma sürecini ölçmez.</li><li>Testler tanıma ve değerlendirme düzeyinde çalışma sağlar; öğrencinin sıfırdan bilimsel model oluşturduğunu tek başına kanıtlamaz.</li><li>Her açık uçlu soruda iki ölçüt vardır. Öğretmen, eş anlamlı bilimsel doğru yanıtları ve çizimleri kabul ederek kısmi puan verebilir.</li><li>Testler otomatik puanlanır. Açık uçlu yanıtlar otomatik doğru/yanlış ilan edilmez.</li><li>Sınavlar resmî MEB soruları değildir. Sınıf içi kullanım öncesi öğretmen denetimi gerekir.</li></ul></section><section class="card"><h3>Kavramsal doğruluk kontrolleri</h3><ul><li>Ay doğal ışık kaynağı değildir; Güneş ışığını yansıtır.</li><li>Normal evrelerin nedeni Dünya’nın gölgesi değildir.</li><li>Ay genel olarak aynı yüzünü gösterirken kendi ekseninde de döner.</li><li>Bir dönme/dolanma yaklaşık 27,3 gün; evre döngüsü yaklaşık 29,5 gündür. Bu süreler birbirine eşit kabul edilmemiştir.</li><li>Ay’ın çok ince gaz örtüsü vardır; “Dünya gibi solunabilir atmosferi var” veya “hiçbir tür gaz yok” denmemiştir.</li><li>Dolunayda bütün küre değil, Dünya’dan görülen yüz tam aydınlık görünür.</li><li>Sağ/sol yarı açıklamaları Türkiye için standart kuzey yarımküre görünüşüne bağlıdır.</li><li>Büyüklük sırası ile gerçek ölçek; uzaydan konum ile Dünya’dan görünüş ayrılmıştır.</li></ul></section></div><section class="card" style="margin-top:20px"><h3>Kaynaklar ve kullanım notu</h3><p>Araştırma tarihi: 2 Kasım 2026. İçerik çerçevesi MEB programına, 2+3+2 dağılımı kullanıcının yüklediği görsele dayanır. Görselin yılı belirtilmediğinden ülke çapındaki bütün güncel Senaryo 2 tablolarının aynı olduğu ileri sürülmez.</p><ul><li><a href="https://tymm.meb.gov.tr/fen-bilimleri-dersi/unite/367" target="_blank" rel="noopener">MEB TYMM · 5. sınıf 1. ünite, öğrenme çıktıları ve süreç bileşenleri</a></li><li><a href="https://tymm.meb.gov.tr/ogretim-programlari/fen-bilimleri-dersi/6" target="_blank" rel="noopener">MEB TYMM · 5. sınıf programı</a></li><li><a href="https://odsgm.meb.gov.tr/www/birinci-donem-ortak-yazili-sinavlarinin-konu-soru-dagilim-tablolari-yayimlandi/icerik/1731/tr" target="_blank" rel="noopener">MEB ÖDSGM · 2026–2027 birinci dönem konu-soru dağılım duyurusu</a></li><li><a href="https://science.nasa.gov/moon/moon-phases/" target="_blank" rel="noopener">NASA · Moon Phases, evreler ve süre farkı</a></li><li><a href="https://science.nasa.gov/moon/facts/" target="_blank" rel="noopener">NASA · Moon Facts, yüzey ve çok ince gaz örtüsü</a></li></ul><p class="muted">Dış bağlantılar internet ister. Uygulamanın sınavları, çizimi, puanlaması ve laboratuvarı internet istemez. Soru ve anahtarlar HTML içinde bulunduğundan bu sistem gözetimli yüksek güvenlikli sınav altyapısı değildir.</p></section>`}
function handleClick(event){let b=event.target.closest('[data-act]');if(!b||b.disabled)return;let a=b.dataset.act,id=b.dataset.id;try{switch(a){case'page':page(b.dataset.target);break;case'filter':filter=b.dataset.value;home();break;case'setup':setup(id);break;case'closeSetup':$('setupDialog').close();break;case'prev':move(active.pos-1);break;case'next':move(active.pos+1);break;case'goto':move(Number(b.dataset.index));break;case'finish':finish();break;case'clearChoice':if(active){active.answers[active.pos].choice=null;persist();showExam()}break;case'clearDraw':clearDraw();break;case'undoDraw':undoDraw();break;case'resume':active=getRecord(id);if(active&&active.status==='active'){showExam();tick()}break;case'result':result(id);window.scrollTo(0,0);break;case'saveMark':saveMark(id,Number(b.dataset.index));break;case'confirmMarks':{let r=getRecord(id);if(r.marks.some(m=>m===null))return;if(confirm('Yanıtları ve çizimleri kontrol ettiğinizi onaylayarak öğretmen onayını işaretlemek istiyor musunuz?')){r.confirmed=true;persist();result(id)}}break;case'printblank':printExam(EXAMS.find(e=>e.id===id));break;case'printkey':printExam(EXAMS.find(e=>e.id===id),true);break;case'printresult':printResult(id);break;case'exportAll':downloadJSON(store.records,true);break;case'exportOne':downloadJSON([getRecord(id)]);break;case'import':$('importFile').value='';$('importFile').click();break;case'delete':if(confirm('Bu öğrenci oturumu ve bütün yanıtları silinsin mi?')){store.records=store.records.filter(r=>r.id!==id);if(active&&active.id===id)active=null;persist();records()}break;case'phaseStep':labP=Number(b.dataset.index)/8;paintLab();break;case'labTab':motion.tab=b.dataset.tab;if(b.dataset.tab==='motion')paintMotion();break;case'motionPlay':if(motion.running){motion.running=false;clearInterval(motion.timer);motion.timer=null;b.textContent='▶ Oynat'}else{motion.running=true;b.textContent='Ⅱ Durdur';motion.timer=setInterval(()=>{motion.time=(motion.time+motion.speed*.004)%1;paintMotion()},40)}break;case'motionReset':motion.time=0;paintMotion();break;case'motionStep':motion.time=(motion.time+.01)%1;paintMotion();break;case'toggleMotion':motion[b.dataset.target]=!motion[b.dataset.target];paintMotion();break;case'animateLab':if(labAnimation){clearInterval(labAnimation);labAnimation=null;b.textContent='▶ Oynat'}else{labAnimation=setInterval(()=>{labP=(labP+.002)%1;paintLab()},90);b.textContent='Ⅱ Durdur'}break}}catch(e){notify('İşlem tamamlanamadı: '+e.message);console.error(e)}}
document.addEventListener('click',handleClick);
document.addEventListener('submit',e=>{if(e.target.id==='startForm'){e.preventDefault();start()}});
document.addEventListener('input',e=>{if(e.target.id==='response'&&active){active.answers[active.pos].text=e.target.value;persist();updateAnswerUI()}if(e.target.id==='phaseRange'){labP=Number(e.target.value)/1000;paintLab()}if(e.target.id==='motionSpeed'){motion.speed=Number(e.target.value);paintMotion()}});
document.addEventListener('change',e=>{if(e.target.name==='choice'&&active){active.answers[active.pos].choice=Number(e.target.value);persist();document.querySelectorAll('.option').forEach(l=>l.classList.toggle('chosen',l.querySelector('input').checked));updateAnswerUI()}if(e.target.matches('[data-criterion]')){let i=Number(e.target.dataset.index),boxes=[...document.querySelectorAll(`[data-index="${i}"][data-criterion]`)];let r=getRecord($('app').dataset.record);if(r){$('mark-'+i).value=boxes.filter(c=>c.checked).length*examOf(r).questions[i].points/2}}if(e.target.id==='importFile')importData(e.target.files[0])});
window.addEventListener('beforeunload',()=>{persist()});
load();active=store.records.find(r=>r.status==='active')||null;home();setInterval(tick,1000);
