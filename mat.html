function ex(){return BANK.find(e=>e.id===cur)}function st(){return store.attempts[cur]||(store.attempts[cur]={name:store.name,answers:{},marks:{},drawings:{},remaining:2400,submitted:false})}
function point(x,y,a,r){return [x+r*Math.cos(a*Math.PI/180),y-r*Math.sin(a*Math.PI/180)]}
function txt(x,y,t,color='#273858',size=18,anchor='middle'){return `<text x="${x}" y="${y}" fill="${color}" font-size="${size}" font-weight="600" text-anchor="${anchor}" dominant-baseline="middle">${t}</text>`}
function line(x1,y1,x2,y2,color='#5655dc',width=3,dash='',arrows=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${dash?'stroke-dasharray="'+dash+'"':''} ${arrows.includes('s')?'marker-start="url(#ar'+uid+')"':''} ${arrows.includes('e')?'marker-end="url(#ar'+uid+')"':''}/>`}
function dot(x,y,label='',color='#273858',drag=''){return `<circle cx="${x}" cy="${y}" r="5" fill="${color}"/>${label?txt(x-13,y+22,label,color,17):''}${drag?`<circle cx="${x}" cy="${y}" r="19" fill="transparent" stroke="${color}" stroke-opacity=".3" data-drag="${drag}"/>`:''}`}
function begin(label='Geometrik model'){uid++;return `<svg viewBox="0 0 760 460" role="img" aria-label="${esc(label)}"><defs><marker id="ar${uid}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><pattern id="grid${uid}" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e2e7f1" stroke-width=".7"/></pattern></defs><rect width="760" height="460" fill="url(#grid${uid})"/>`}
function arc(x,y,start,sweep,r,color='#087f85',label=''){if(sweep===0)return '';let p=point(x,y,start,r),q=point(x,y,start+sweep,r),large=Math.abs(sweep)>180?1:0,flag=sweep>0?0:1;let path=Math.abs(sweep)>=359.99?`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${color}" stroke-width="2"/>`:`<path d="M${p} A${r} ${r} 0 ${large} ${flag} ${q}" fill="none" stroke="${color}" stroke-width="2"/>`;if(label){let l=point(x,y,start+sweep/2,r+22);path+=txt(...l,label,color,17)}return path}
function protractor(x,y,rot=0,draggable=false){let s=`<g transform="translate(${x} ${y}) rotate(${-rot})"><path d="M-205 0 A205 205 0 0 1 205 0 Z" fill="#e4ebff" fill-opacity=".65" stroke="#6671a8" stroke-width="1.4"/><path d="M-150 0 A150 150 0 0 1 150 0" fill="none" stroke="#9da8cc"/>`;for(let k=0;k<=180;k++){let t=k*Math.PI/180,r=k%10===0?185:k%5===0?194:199;s+=line(205*Math.cos(t),-205*Math.sin(t),r*Math.cos(t),-r*Math.sin(t),'#67729a',k%10===0?1.3:.6);if(k%10===0){s+=txt(174*Math.cos(t),-174*Math.sin(t),k,'#263d85',10);s+=txt(155*Math.cos(t),-155*Math.sin(t),180-k,'#087f85',10)}}s+=line(-205,0,205,0,'#67729a',1.4)+line(-10,0,10,0,'#ce5c45',1.5)+line(0,-10,0,10,'#ce5c45',1.5);if(draggable)s+=`<circle cx="0" cy="0" r="17" fill="#ffffffcc" stroke="#ce5c45" data-drag="pro"/>`+txt(0,33,'⊕ merkezi sürükle','#6a7192',12);return s+'</g>'}
function angleFigure(v,opts={}){let x=380,y=305,base=v.base||0,dir=v.dir||1,a=v.angle,end=base+dir*a;let s=begin('AOB açısı; açıölçerle ölçülebilir');if(opts.pro)s+=protractor(opts.px??380,opts.py??305,opts.rot||0,!!opts.drag);let p=point(x,y,base,235),q=point(x,y,end,220);s+=line(x,y,...p,'#5655dc',4,'','e')+line(x,y,...q,'#087f85',4,'','e')+arc(x,y,base,dir*a,52,'#bb7840',opts.show?a+'°':'');s+=dot(x,y,'O');let la=point(x,y,base,260),lb=point(x,y,end,249);s+=txt(...la,'A','#5655dc',20)+txt(...lb,'B','#087f85',20);if(opts.drag)s+=dot(...q,'','#087f85','arm');return s+'</svg>'}
function relationFigure(a,type,show=false){let x=380,y=235,s=begin('Kesişen doğrularda açı ilişkileri');if(type==='complement'){s+=line(x,y,635,y,'#5655dc',3,'','e')+line(x,y,x,40,'#5655dc',3,'','e');let p=point(x,y,a,230);s+=line(x,y,...p,'#087f85',3,'','e');s+=`<path d="M${x+18} ${y} v-18 h-18" stroke="#657196" fill="none"/>`;s+=arc(x,y,0,a,80,'#a16e34',a+'°')+arc(x,y,a,90-a,125,'#087f85',show?(90-a)+'°':'β')}else{let p=point(x,y,a,250),q=point(x,y,a+180,250);s+=line(95,y,665,y,'#5655dc',3,'','se')+line(...p,...q,'#087f85',3,'','se');s+=arc(x,y,0,a,68,'#a16e34',a+'°');if(type==='vertical')s+=arc(x,y,180,a,68,'#087f85',show?a+'°':'β');else s+=arc(x,y,a,180-a,110,'#087f85',show?(180-a)+'°':'β');if(show){s+=arc(x,y,180+a,180-a,105,'#7465b6',(180-a)+'°');if(type!=='vertical')s+=arc(x,y,180,a,65,'#087f85',a+'°')}}s+=dot(x,y,'O');return s+'</svg>'}
function polyPoints(n){return Array.from({length:n},(_,i)=>point(380,225,90+i*360/n,157))}
function polygonFigure(n,closed=true,support=false){let p=polyPoints(n),s=begin('Doğru parçalarından oluşan '+(closed?'kapalı':'açık')+' şekil');let edges=closed?n:n-1;if(support)for(let i=0;i<edges;i++){let a=p[i],b=p[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);s+=line(a[0]-dx/len*85,a[1]-dy/len*85,b[0]+dx/len*85,b[1]+dy/len*85,'#c1b9e5',1.3,'6 5','se')}if(closed)s+=`<polygon points="${p.map(x=>x.join(',')).join(' ')}" fill="#eeedff" stroke="none"/>`;for(let i=0;i<edges;i++)s+=line(...p[i],...p[(i+1)%n],'#5655dc',3.5);p.forEach((a,i)=>{s+=dot(...a);let t=point(380,225,90+i*360/n,182);s+=txt(...t,'ABCDEFGH'[i],'#273858',17)});return s+'</svg>'}
function figure(v,opts={}){if(v.type==='none'||v.type==='blank')return '';if(v.type==='angle')return angleFigure(v,opts);if(v.type==='relation')return relationFigure(v.angle,v.relation,opts.show);if(v.type==='poly')return polygonFigure(v.n,v.closed,false);let s=begin('Geometrik çizim için verilenler');if(v.type==='points')s+=dot(245,235,'A')+dot(525,235,'B');else if(v.type==='center'||v.type==='circle')s+=dot(380,230,'O');else if(v.type==='twoCenters')s+=dot(240,230,'O₁')+dot(520,230,'O₂');else if(v.type==='ray')s+=line(140,250,650,250,'#5655dc',3,'','e')+dot(140,250,'K');else if(v.type==='perpTask')s+=line(85,310,680,310,'#5655dc',3,'','se')+txt(670,332,'d')+dot(330,125,'P');else if(v.type==='line')s+=line(85,270,680,270,'#5655dc',3,'','se')+txt(670,295,'d');return s+'</svg>'}
function home(m=filter){nav('home');filter=m;teacher=false;let started=Object.keys(store.attempts).length;app.innerHTML=`<section class="hero"><div><span class="tag">ÖLÇ · İNŞA ET · GEREKÇELENDİR</span><h1>Geometriyi gör.<br>Dokunarak keşfet.</h1><p>Senaryo 4’e uygun ayrı sınavlar ve sekiz etkileşimli çalışma istasyonu. Önce laboratuvarda keşfet, sonra öğrendiğini sına.</p><div class="row"><button class="primary" onclick="lab()">Laboratuvarı aç →</button><button onclick="info()">Kapsamı incele</button></div></div><div class="heroArt">${angleFigure({angle:65,base:0,dir:1},{pro:true,show:true})}</div></section><div class="stats"><div class="stat"><span>20 + 20</span><small>Ayrı türde sınav</small></div><div class="stat"><span>240</span><small>Soru kaydı</small></div><div class="stat"><span>8</span><small>Laboratuvar istasyonu</small></div><div class="stat"><span>${started}</span><small>Başlanmış sınav</small></div></div><section class="card"><div class="row between"><div><h2>Sınav kütüphanesi</h2><p class="muted">Her sınav 6 soru · 100 puan · 1–1–2–1–1 çıktı dağılımı</p></div><label class="field nameform">Öğrenci adı / rumuzu<input value="${esc(store.name)}" placeholder="İsteğe bağlı" oninput="store.name=this.value;save()"></label></div><div class="filters"><button class="${m==='open'?'selected':''}" onclick="home('open')">Açık uçlu <span class="tabcount">20 sınav</span></button><button class="${m==='mc'?'selected':''}" onclick="home('mc')">Çoktan seçmeli <span class="tabcount">20 sınav</span></button></div><p class="notice">${m==='open'?'Bu bölümde yalnız açık uçlu sorular vardır. Metin, çizim ve gerekçe öğretmen rubriğiyle değerlendirilir.':'Bu bölümde yalnız dört seçenekli sorular vardır. Altı sorunun tamamı otomatik puanlanır.'}</p><div class="grid">${BANK.filter(e=>e.mode===m).map(e=>{let a=store.attempts[e.id];return `<article class="card examcard subtle"><div class="row between"><span class="cardnum">${String(e.no).padStart(2,'0')}</span><span class="tag ${m==='open'?'teal':''}">${m==='open'?'Açık uçlu':'Çoktan seçmeli'}</span></div><h3>${e.name}</h3><p class="muted">Araçlar · açı ölçme · açı ilişkileri · çokgenler</p><small>${a?(a.submitted?'Teslim edildi':'Devam ediyor'):'Henüz başlanmadı'}</small><div class="actions"><button class="primary" onclick="openExam('${e.id}')">${a?'Sınavı aç':'Başla'}</button><button onclick="printExam('${e.id}',false)">Yazdır</button></div></article>`}).join('')}</div></section><p class="footer">Çalışma materyalidir; resmî MEB sınavı değildir. Bazı soru aileleri farklı bağlam ve ölçülerle tekrar kullanılır.</p>`}
function openExam(id){stop();cur=id;qi=0;teacher=false;st();renderExam();window.scrollTo(0,0)}
function renderExam(){stop();let e=ex(),a=st(),q=e.questions[qi];let count=e.questions.filter(q=>a.answers[q.id]!==undefined&&String(a.answers[q.id]).trim()!==''||a.drawings[q.id]).length;app.innerHTML=`<div class="row between" style="margin-bottom:18px"><div><span class="tag ${e.mode==='open'?'teal':''}">${e.mode==='open'?'Yalnız açık uçlu':'Yalnız çoktan seçmeli'}</span><h2 style="margin-top:10px">${String(e.no).padStart(2,'0')} · ${e.name}</h2><small>${esc(a.name||'Öğrenci')} · Senaryo 4</small></div><button onclick="home('${e.mode}')">← Kütüphane</button></div><div class="layout"><section class="card"><div class="row between"><span class="tag">${q.code}</span><span class="muted">${q.points} puan · Soru ${qi+1}/6</span></div><p class="qtitle">${esc(q.text)}</p>${q.visual.type!=='none'&&q.visual.type!=='blank'?`<div id="examVisual" class="visual">${figure(q.visual,{pro:false})}</div>`:''}${q.visual.type==='angle'?`<div class="row"><button onclick="toggleExamPro()">Açıölçeri göster / gizle</button><small>Yönü ve ölçeği inceleyin.</small></div>`:''}${e.mode==='mc'?`<div>${q.options.map((v,k)=>`<label class="option ${a.answers[q.id]===k?'chosen':''}"><input type="radio" name="answer" ${a.answers[q.id]===k?'checked':''} onchange="setAnswer(${k},true)"><span class="letter">${'ABCD'[k]}</span><span>${esc(v)}</span></label>`).join('')}</div>`:`<label class="field" for="response">Yanıt ve gerekçe</label><textarea id="response" oninput="setAnswer(this.value)" placeholder="Araç seçimini, adımlarını ve gerekçeni yaz…">${esc(a.answers[q.id]||'')}</textarea><details class="drawbox" ${a.drawings[q.id]?'open':''}><summary>Çizim alanını aç</summary><div class="drawtools">${[['pen','Kalem'],['line','Doğru parçası'],['ray','Işın'],['full','Doğru'],['circle','Çember']].map(([v,t])=>`<button onclick="drawMode='${v}';$('drawTool').textContent='Araç: ${t}'">${t}</button>`).join('')}<button class="danger" onclick="clearDraw()">Temizle</button></div><small id="drawTool">Araç: Kalem</small><canvas id="drawing" width="1000" height="440" aria-label="Öğrenci çizim alanı"></canvas><p class="labhint">Basılı tutup sürükleyin. Çemberde ilk nokta merkezdir. Çizemiyorsanız yapım adımlarını metinle açıklayın.</p></details>`}${teacher?`<div class="answerkey"><h3>Örnek yanıt</h3><p>${esc(q.answer)}</p>${e.mode==='mc'?`<p>Doğru seçenek: ${'ABCD'[q.correct]}</p>`:`<ul>${q.rubric.map(([t,p])=>`<li>${t}: ${p} puan</li>`).join('')}</ul><label class="field">Öğretmen puanı (0–${q.points})<input class="markinput" type="number" min="0" max="${q.points}" step="0.5" value="${a.marks[q.id]??''}" onchange="setMark(this.value,${q.points})"></label>`}</div>`:''}<div class="row between" style="margin-top:24px"><button ${qi===0?'disabled':''} onclick="gotoQ(${qi-1})">← Önceki</button><button ${qi===5?'disabled':''} class="primary" onclick="gotoQ(${qi+1})">Sonraki →</button></div></section><aside class="card aside"><span class="muted">Önerilen süre</span><div class="timer" id="clock"></div><button onclick="toggleTimer()">Başlat / durdur</button><div class="qnav">${e.questions.map((p,i)=>`<button class="${i===qi?'current':''} ${a.answers[p.id]!==undefined||a.drawings[p.id]?'done':''}" onclick="gotoQ(${i})">${i+1}</button>`).join('')}</div><progress value="${count}" max="6"></progress><p class="progressText" id="progressText">${count}/6 soruda kayıt var</p><div class="sidetext"><p class="muted">Değişiklikler otomatik kaydedilir. Türler karışmaz.</p></div><div class="stepbuttons"><button class="primary" onclick="submitExam()">Teslim / sonuç</button><button onclick="teacher=!teacher;renderExam()">${teacher?'Öğrenci görünümü':'Öğretmen / anahtar'}</button><button onclick="printExam(cur,teacher)">Yazdır / PDF</button><button class="danger" onclick="resetExam()">Sıfırla</button></div></aside></div><div id="result"></div>`;if(e.mode==='open')initDrawing();clock();if(a.submitted||teacher)renderResult()}
let examPro=false;function toggleExamPro(){examPro=!examPro;$('examVisual').innerHTML=figure(ex().questions[qi].visual,{pro:examPro})}
function gotoQ(i){if(i<0||i>5)return;qi=i;examPro=false;save();renderExam()}
function setAnswer(v,redraw=false){st().answers[ex().questions[qi].id]=v;save();let n=ex().questions.filter(q=>(st().answers[q.id]!==undefined&&String(st().answers[q.id]).trim()!=='')||st().drawings[q.id]).length;if($('progressText'))$('progressText').textContent=n+'/6 soruda kayıt var';if(redraw){document.querySelectorAll('.option').forEach((el,i)=>el.classList.toggle('chosen',i===v))}if(st().submitted||teacher)renderResult()}
function setMark(v,max){let id=ex().questions[qi].id;if(v==='')delete st().marks[id];else st().marks[id]=Math.min(max,Math.max(0,Number(v)||0));save();renderResult()}
function totals(e,a){let score=0,pending=0;for(let q of e.questions){if(e.mode==='mc'){if(a.answers[q.id]===q.correct)score+=q.points}else if(a.marks[q.id]==null)pending++;else score+=a.marks[q.id]}return {score,pending}}
function renderResult(){let e=ex(),a=st(),t=totals(e,a);$('result').innerHTML=`<section class="card review"><div class="resulthead"><div><h2>${e.mode==='mc'?'Test sonucu':'Öğretmen değerlendirmesi'}</h2><p class="muted">${t.pending?t.pending+' açık uçlu soru puan bekliyor. Toplam geçicidir.':'Değerlendirme tamamlandı.'}</p></div><div class="score">${t.score}<small>/100</small></div></div><div class="tablewrap"><table><tr><th>Çıktı</th><th>Puan</th><th>Üst sınır</th></tr>${[...new Set(e.questions.map(q=>q.code))].map(c=>{let qs=e.questions.filter(q=>q.code===c),s=qs.reduce((t,q)=>t+(e.mode==='mc'?(a.answers[q.id]===q.correct?q.points:0):(a.marks[q.id]||0)),0);return `<tr><td>${c}</td><td>${s}${e.mode==='open'&&qs.some(q=>a.marks[q.id]==null)?' (bekliyor)':''}</td><td>${qs.reduce((t,q)=>t+q.points,0)}</td></tr>`}).join('')}</table></div><p class="notice">${e.mode==='mc'?'Yanlış yanıtlar doğru yanıtları götürmez. Cevap ve açıklamalar için öğretmen görünümünü açabilirsiniz.':'Açık uçlu yanıtlar otomatik doğru/yanlış sayılmaz. Öğretmen her soruyu çizim ve gerekçeyle birlikte inceler.'}</p></section>`}
function submitExam(){if(!confirm('Yanıtlar teslim edilsin / sonuç güncellensin mi? Sonradan düzenleme mümkündür.'))return;st().submitted=true;stop();save();renderResult();$('result').scrollIntoView({behavior:'smooth'})}
function clock(){if(!$('clock'))return;let t=st().remaining;$('clock').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function toggleTimer(){if(ticker){stop();save();return}if(st().remaining<=0){toast('Süre doldu; çalışmaya devam edebilirsiniz.');return}ticker=setInterval(()=>{st().remaining--;clock();if(st().remaining%10===0)save();if(st().remaining<=0){stop();save();toast('Süre doldu. Otomatik teslim yapılmadı.')}},1000)}
function resetExam(){if(confirm('Bu sınavın kayıtları silinsin mi?')){delete store.attempts[cur];save();renderExam()}}
function initDrawing(){let c=$('drawing'),ctx=c.getContext('2d'),active=false,start,base;ctx.strokeStyle='#5149b7';ctx.lineWidth=3;ctx.lineCap='round';let id=ex().questions[qi].id;drawMode='pen';if(st().drawings[id]){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0);im.src=st().drawings[id]}const pt=e=>{let r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width*c.width,(e.clientY-r.top)/r.height*c.height]};function ln(a,b){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}function arr(a,b){let t=Math.atan2(b[1]-a[1],b[0]-a[0]);for(let k of [-.4,.4])ln(b,[b[0]-15*Math.cos(t+k),b[1]-15*Math.sin(t+k)])}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);active=true;start=pt(e);base=ctx.getImageData(0,0,c.width,c.height);ctx.beginPath();ctx.moveTo(...start)};c.onpointermove=e=>{if(!active)return;let end=pt(e);if(drawMode==='pen'){ctx.lineTo(...end);ctx.stroke();return}ctx.putImageData(base,0,0);if(drawMode==='circle'){ctx.beginPath();ctx.arc(...start,Math.hypot(end[0]-start[0],end[1]-start[1]),0,Math.PI*2);ctx.stroke()}else if(drawMode==='line')ln(start,end);else{let dx=end[0]-start[0],dy=end[1]-start[1],l=Math.hypot(dx,dy);if(l<3)return;let ux=dx/l,uy=dy/l;function edge(s){let ts=[ux?((ux*s>0?c.width:0)-start[0])/(s*ux):Infinity,uy?((uy*s>0?c.height:0)-start[1])/(s*uy):Infinity],t=Math.min(...ts.filter(t=>t>=0))-14;return [start[0]+s*ux*t,start[1]+s*uy*t]}let a=drawMode==='full'?edge(-1):start,b=edge(1);ln(a,b);arr(a,b);if(drawMode==='full')arr(b,a)}};c.onpointerup=c.onpointercancel=()=>{if(!active)return;active=false;st().drawings[id]=c.toDataURL();save()}}
function clearDraw(){if(!confirm('Bu çizim temizlensin mi?'))return;let c=$('drawing');c.getContext('2d').clearRect(0,0,c.width,c.height);delete st().drawings[ex().questions[qi].id];save()}

function info(){nav('info');app.innerHTML=`<section class="hero"><div><span class="tag">TASARIM · KAPSAM · ÖLÇME</span><h1>Bir görselden<br>geometrik düşünmeye.</h1><p>Fen uygulamanızın kart sistemi, renk dili, tek soru akışı ve laboratuvar yaklaşımı referans alınarak yeniden tasarlandı.</p></div></section><section class="card"><h2>Senaryo 4 kapsamı</h2><div class="tablewrap"><table><tr><th>Çıktı</th><th>Hedeflenen kanıt</th><th>Her sınav</th><th>Laboratuvar</th></tr><tr><td>MAT.5.3.1</td><td>Araç seçme ve geometrik çizim</td><td>1 soru / 20 puan</td><td>Temel çizimler, çember, dikme</td></tr><tr><td>MAT.5.3.2</td><td>Çizim deneyiminden çıkarım ve yansıtma</td><td>1 soru / 15 puan</td><td>Eş uzunluk, eş yarıçap, uzaklık karşılaştırma</td></tr><tr><td>MAT.5.3.3</td><td>Açı ölçme, derece ve eş açı fikri</td><td>2 soru / 30 puan</td><td>Açı ölçme ve açı türleri</td></tr><tr><td>MAT.5.3.4</td><td>İki / üç doğru ve açı ilişkileri</td><td>1 soru / 15 puan</td><td>Doğruların konumu ve açı ilişkileri</td></tr><tr><td>MAT.5.3.5</td><td>Ardışık kesişen doğrulardan kapalı çokgen</td><td>1 soru / 20 puan</td><td>Çokgen oluşturma</td></tr></table></div><h3 style="margin-top:25px">Görsellerde yapılan değişiklikler</h3><ul><li>Tüm modeller tek SVG altyapısında üretilir. Daire ve açı geometrisi ekranın en-boy oranı değişse de bozulmaz.</li><li>Işın ve doğrularda oklar; doğru parçalarında sınırlı uçlar; dikmede diklik işareti bulunur.</li><li>Açıölçerde iki ölçek, merkez işareti, taşıma ve döndürme vardır. Laboratuvarda otomatik hizalama yalnız yardımcı seçenektir.</li><li>Sınavların ikinci açı modelinde başlangıç kolu soldadır; doğru ölçekten okuma gerekir. Ölçü, cevap verilmeden görselin üzerine yazılmaz.</li><li>Çizim sorularında tamamlanmış çözüm yerine verilen noktalar / doğrular gösterilir.</li></ul><h3>Öğretim yaklaşımı ve sınırlar</h3><p>Programda araç ve teknolojiyle çalışma, çıkarım, yorumlama ve yansıtma öne çıkar. Laboratuvarlar tahmin, müdahale ve kontrol adımlarını birleştirir. 5. sınıfın bütün yılı değil, yüklenen Senaryo 4’teki MAT.5.3.1–5 çıktıları hedeflenir. MAT.5.3.6–7 bu sınav paketinin kapsamında değildir.</p><p>Üç doğru modelleri aynı noktada kesişme ve iki ayrı kesişimli kesen örneklerini kapsar. Çakışık yönler seçildiğinde altı ayrı açı bölgesi oluşmayabilir. Çokgenlerde dış bükey örnekler kullanılır; köşegen sayısı veya üçgen dışındaki çokgenlerin iç açı toplamı hesaplatılmaz.</p><p>Testler araç kullanımının yalnız dolaylı kanıtıdır. Fiziksel araç kullanımı ve öğrencinin çizimi öğretmen tarafından ayrıca gözlenmelidir. Dijital serbest çizim alanı otomatik doğruluk denetimi veya geometrik ispat yapmaz.</p><h3>Puanlama ve kullanım</h3><p>20 açık uçlu ve 20 test sınavı ayrıdır. Her biri 6 soru ve 100 puandır. Açık uçlular rubrikle öğretmen tarafından, testler otomatik değerlendirilir. 40 dakika ve puan dağılımı uygulama tasarımıdır. Soru aileleri bağlam ve ölçü varyantlarıyla tekrar kullanılabilir; 240 kayıt, 240 benzersiz pedagojik tip değildir.</p><p>Süre sayacı soru veya ekran değişiminde durur; devam etmek için yeniden başlatın. Süre dolduğunda otomatik teslim yapılmaz. Öğretmen görünümü şifresizdir. Yüksek güvenlikli sınav veya çok kullanıcılı sınıf yönetimi sistemi değildir.</p><p>JSON yedek alın. Kayıtlar localStorage kotası ve tarayıcı politikasına bağlıdır. Çok fazla çizim kotayı doldurabilir. Yazdırma öğrenci formunu veya öğretmen anahtarını ayrı üretir; önizlemeyi kontrol edin.</p><h3>Kaynak ve tasarım referansı</h3><ul><li>Kullanıcının yüklediği matematik Senaryo 4 görseli.</li><li>Kullanıcının yüklediği fen.html: arayüz ve etkileşim referansı; fen soruları matematik içeriğine aktarılmadı.</li><li><a href="https://tymm.meb.gov.tr/ortaokul-matematik-dersi/unite/448" target="_blank" rel="noopener">MEB TYMM — 5. sınıf Geometrik Şekiller</a></li></ul></section>`}

 s+=`<g data-handle="toolMove"><rect x="-32" y="73" width="64" height="27" rx="7" fill="white" stroke="#8798af"/>${wbText(0,87,'TAŞI','#536985',12)}</g></g>`;

function wbSVG(exporting=false){let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" ${exporting?'width="1000" height="640"':''} role="img" aria-label="Geometrik çizim masası"><defs><marker id="wbArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#554cc4" stroke-width="1.5"/></marker><pattern id="wbGrid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#dce5f1" stroke-width=".7"/></pattern></defs><rect width="1000" height="640" fill="#fbfcff"/>`;
 if(W.showGrid)s+='<rect width="1000" height="640" fill="url(#wbGrid)"/>';

 if(!exporting)s+=wbToolSVG();
 if(!exporting&&W.preview){let p=W.preview;if(p.type==='line')s+=`<line x1="${p.a.x}" y1="${p.a.y}" x2="${p.b.x}" y2="${p.b.y}" stroke="#d58b2c" stroke-width="3" stroke-dasharray="7 5"/>`;if(p.type==='arc')s+=`<g fill="none" stroke="#d58b2c" stroke-width="3">${wbPathArc(p.c,p.r,p.start,p.sweep)}</g>`}
 for(let p of W.doc.points){let color=!exporting&&W.picks.includes(p.id)?'#c47d23':'#283f5c';s+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}"/>`+wbText(Math.max(12+Math.min(60,p.label.length*4),Math.min(988-Math.min(60,p.label.length*4),p.x+13)),Math.max(15,Math.min(625,p.y-16)),p.label,color,15);if(!exporting)s+=`<circle data-point="${p.id}" cx="${p.x}" cy="${p.y}" r="13" fill="transparent"/>`}
 if(!exporting&&W.pending)s+=`<circle cx="${W.pending.x}" cy="${W.pending.y}" r="7" fill="#f1a239"/>`;

function wbRender(){if(!$('wbStage'))return;$('wbStage').innerHTML=wbSVG(false);let hints={select:'Noktaları taşıyın; iki noktayı hizalama, üç noktayı açı için seçin.',point:'Boş alana dokunarak nokta ekleyin.',segment:'Başlangıç ve bitiş noktalarına sırayla dokunun.',ray:'Başlangıç noktasına, sonra yönü belirleyen noktaya dokunun.',line:'İki farklı noktaya dokunun.',toolLine:'Cetvel / gönye kenarı boyunca basılı tutup sürükleyin.',compassTrace:'Pergelin kalem ucunu tutup çevresinde sürükleyin.'};$('wbHint').textContent=hints[W.mode]||''}

function wbAttach(){const stage=$('wbStage');let D=null;function xy(e){let p=new DOMPoint(e.clientX,e.clientY).matrixTransform(stage.querySelector('svg').getScreenCTM().inverse());return {x:p.x,y:p.y}}
 stage.onpointerdown=e=>{e.preventDefault();const p=xy(e),handle=e.target.closest('[data-handle]')?.dataset.handle,pid=e.target.closest('[data-point]')?.dataset.point,oid=e.target.closest('[data-object]')?.dataset.object;stage.setPointerCapture(e.pointerId);let before=wbSnapshot();
 if(handle){
  if(handle==='compassNib'&&W.mode==='compassTrace'){D={type:'trace',before,center:{x:W.tool.x,y:W.tool.y},r:W.tool.r,start:W.tool.arm,last:W.tool.arm,sweep:0};return}
  D={type:handle,before,start:p,tool:wbClone(W.tool),pointerAngle:Math.atan2(W.tool.y-p.y,p.x-W.tool.x)*180/Math.PI};return;
 }
 if(W.mode==='toolLine'){if(!['ruler','square'].includes(W.tool.kind)||!W.showTool){toast('Önce cetvel veya gönye seçin.');return}let a=wbNearest(p,{onEdge:true});D={type:'edge',before,a,b:a};W.preview={type:'line',a,b:a};wbRender();return}
 if(W.mode==='compassTrace'){toast('Yay çizimine pergeli seçip kalem ucundan başlayın.');return}
 if(W.mode==='select'){
  if(pid){W.selectedPoint=pid;W.picks=W.picks.filter(i=>i!==pid).concat(pid).slice(-3);D={type:'point',id:pid,before,start:p,original:{...wbP(pid)}}}
  else if(oid){W.selectedObject=oid;D={type:'selection'}}
  else{W.selectedPoint=W.selectedObject=null;W.picks=[];D={type:'selection'}}
  wbRender();wbSidebar();return;
 }
 D={type:'click',p,before};
 };
 stage.onpointermove=e=>{
  const p=xy(e);if(!D){if(W.pending&&['segment','ray','line'].includes(W.mode)){W.preview={type:'line',a:W.pending,b:wbNearest(p)};wbRender()}return}
  if(D.type==='toolMove'){
   W.tool.x=Math.max(30,Math.min(970,D.tool.x+p.x-D.start.x));W.tool.y=Math.max(30,Math.min(610,D.tool.y+p.y-D.start.y));
   if(W.snap){let q=W.doc.points.find(q=>wbDist(q,{x:W.tool.x,y:W.tool.y})<10);if(q){W.tool.x=q.x;W.tool.y=q.y}}
  }else if(D.type==='toolRotate'){
   let a=Math.atan2(W.tool.y-p.y,p.x-W.tool.x)*180/Math.PI,delta=((a-D.pointerAngle+540)%360)-180;W.tool.angle=((D.tool.angle+delta+540)%360)-180;
   if(Math.abs(W.tool.angle-Math.round(W.tool.angle/15)*15)<.8)W.tool.angle=Math.round(W.tool.angle/15)*15;
  }else if(D.type==='point'){
   let q=wbNearest({x:D.original.x+p.x-D.start.x,y:D.original.y+p.y-D.start.y});if(q.existing===D.id)q={x:Math.max(8,Math.min(992,D.original.x+p.x-D.start.x)),y:Math.max(8,Math.min(632,D.original.y+p.y-D.start.y))};let point=wbP(D.id);point.x=q.x;point.y=q.y;
  }else if(D.type==='edge'){
   D.b=wbNearest(p,{onEdge:true});W.preview={type:'line',a:D.a,b:D.b};
  }else if(D.type==='compassNib'){
   W.tool=wbCompassNext(W.tool,p);
  }else if(D.type==='trace'){
   const a=Math.atan2(D.center.y-p.y,p.x-D.center.x)*180/Math.PI;let delta=((a-D.last+540)%360)-180;D.sweep+=delta;D.last=a;W.tool.arm=a;W.tool.r=D.r;W.preview={type:'arc',c:D.center,r:D.r,start:D.start,sweep:Math.max(-360,Math.min(360,D.sweep))};
  }
  wbRender();if($('wbAngle'))$('wbAngle').value=Math.round(W.tool.angle);if($('wbAngleText'))$('wbAngleText').textContent=W.tool.angle.toFixed(1)+'°';
 };
 stage.onpointerup=e=>{
  if(!D)return;const d=D;D=null;
  if(d.type==='click'){
   let p=wbNearest(d.p);
   if(W.mode==='point')wbPoint(p);
   else if(['segment','ray','line'].includes(W.mode)){
    if(!W.pending){W.pending=p;W.preview=null;wbRender();return}
    if(wbDist(W.pending,p)<1){toast('İki farklı nokta seçin.');return}
    wbObject({type:W.mode,a:wbPoint(W.pending),b:wbPoint(p)});W.pending=null;
   }
  }else if(d.type==='edge'&&wbDist(d.a,d.b)>=1){wbObject({type:'segment',a:wbPoint(d.a),b:wbPoint(d.b),madeWith:W.tool.kind})}
  else if(d.type==='trace'&&Math.abs(d.sweep)>=2){let c=wbPoint(d.center);let sweep=Math.max(-360,Math.min(360,d.sweep));wbObject(Math.abs(sweep)>=359.5?{type:'circle',c,r:d.r}:{type:'arc',c,r:d.r,start:d.start,sweep})}
  wbFinish(d.before||wbSnapshot());
 };
 stage.onpointercancel=()=>{if(D?.before){let data=JSON.parse(D.before);W.doc=data.doc;W.tool=data.tool}D=null;W.preview=null;wbRender();wbSidebar()};
}
function wbExport(type){if(type==='svg')download('geometri-cizim.svg',wbSVG(true),'image/svg+xml;charset=utf-8');else download('geometri-cizim.json',JSON.stringify({version:1,doc:W.doc,tool:W.tool},null,2))}
function wbValid(data){if(data?.version!==1||!data.doc||!Array.isArray(data.doc.points)||!Array.isArray(data.doc.objects)||data.doc.points.length>1000||data.doc.objects.length>2000)throw Error('Biçim');let ids=new Set;for(let p of data.doc.points){if(typeof p.id!=='string'||!/^p[A-Za-z0-9_-]{0,50}$/.test(p.id)||ids.has(p.id)||!Number.isFinite(p.x)||!Number.isFinite(p.y)||p.x<0||p.x>1000||p.y<0||p.y>640||typeof p.label!=='string')throw Error('Nokta');ids.add(p.id)}for(let o of data.doc.objects){if(typeof o.id!=='string'||!/^o[A-Za-z0-9_-]{0,50}$/.test(o.id)||ids.has(o.id)||!['segment','ray','line','circle','arc','parallel','perpendicular'].includes(o.type))throw Error('Şekil');ids.add(o.id);if(['segment','ray','line'].includes(o.type)&&(!wbP(o.a,data.doc)||!wbP(o.b,data.doc)||o.a===o.b||wbDist(wbP(o.a,data.doc),wbP(o.b,data.doc))<1e-8))throw Error('Uç');if(['circle','arc'].includes(o.type)&&(!wbP(o.c,data.doc)||!Number.isFinite(o.r)||o.r<=0||o.r>1000))throw Error('Yarıçap');if(o.type==='arc'&&(!Number.isFinite(o.start)||!Number.isFinite(o.sweep)||Math.abs(o.sweep)>360))throw Error('Yay')}
 for(let o of data.doc.objects)if(['parallel','perpendicular'].includes(o.type)&&(!wbP(o.through,data.doc)||!wbLine(o,data.doc)))throw Error('Bağlantı');data.doc.next=Math.max(1,...[...ids].map(id=>parseInt(id.replace(/\D/g,''))||0))+1;return data}
function wbImport(input){let f=input.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let data=wbValid(JSON.parse(r.result));if(!confirm('Yüklenen çizim mevcut çizimin yerine geçsin mi?'))return;wbChange(()=>{W.doc=data.doc;if(data.tool&&['ruler','square','compass','protractor','none'].includes(data.tool.kind)&&['x','y','angle','r','arm'].every(k=>Number.isFinite(data.tool[k])))W.tool={...W.tool,...data.tool,r:Math.max(10,Math.min(230,data.tool.r))};W.picks=[];W.pending=null;W.selectedPoint=W.selectedObject=null});toast('Çizim yüklendi.')}catch{toast('Geçersiz çizim dosyası.')}input.value=''};r.readAsText(f)}

/* Numerical and rendered-SVG diagnostics. No student document is modified. */
let DREPORT=[];
function diagCase(group,name,fn){try{let out=fn();if(out===false)throw Error('Beklenen koşul sağlanmadı');DREPORT.push({group,name,status:'pass',detail:typeof out==='string'?out:'Koşul sağlandı'})}catch(e){DREPORT.push({group,name,status:'fail',detail:String(e.message||e)})}}
function diagAssert(value,message){if(!value)throw Error(message||'Beklenen koşul sağlanmadı')}
function diagSVG(svg,fn){let host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:1000px;visibility:hidden';host.innerHTML=svg;document.body.append(host);try{return fn(host)}finally{host.remove()}}
function runDiagnostics(){DREPORT=[];
 for(let angle of [-150,-90,-30,0,15,45,90,150]){
  diagCase('Cetvel',angle+'° yönünde izdüşüm kenarın üzerinde',()=>{let tool={kind:'ruler',x:500,y:320,angle},a=wbWorld(tool,{x:-350,y:0}),b=wbWorld(tool,{x:350,y:0});let max=0;for(let p of [{x:100,y:150},{x:650,y:400},{x:400,y:610}]){let q=wbProject(tool,p),err=Math.abs((q.x-a.x)*(b.y-a.y)-(q.y-a.y)*(b.x-a.x))/700;max=Math.max(max,err);diagAssert(err<1e-8,'Kenar sapması '+err)}return 'En büyük kenar sapması '+max.toExponential(2)+' model pikseli'});
  diagCase('Gönye',angle+'° yönünde iki dik kenar',()=>{let t={kind:'square',angle,x:500,y:320},o=wbWorld(t,{x:0,y:0}),a=wbWorld(t,{x:220,y:0}),b=wbWorld(t,{x:0,y:-220}),dot=(a.x-o.x)*(b.x-o.x)+(a.y-o.y)*(b.y-o.y);diagAssert(Math.abs(dot)<1e-7,'Diklik bozuldu');return 'Skaler çarpım '+dot.toExponential(2)});
 }
 for(let rot of [-180,-90,0,15,90,180])diagCase('Açıölçer',rot+'° dönüşte merkez ve taban orta noktası',()=>diagSVG(begin()+protractor(380,305,rot,false)+'</svg>',host=>{let g=host.querySelector('[data-role=instrument]'),l=host.querySelector('[data-role=baseline]'),center=host.querySelector('[data-role=center]');diagAssert(g&&l&&center,'İşaretler eksik');let a=new DOMPoint(+center.getAttribute('cx'),+center.getAttribute('cy')).matrixTransform(center.getScreenCTM()),b=new DOMPoint((+l.getAttribute('x1')+ +l.getAttribute('x2'))/2,(+l.getAttribute('y1')+ +l.getAttribute('y2'))/2).matrixTransform(l.getScreenCTM()),err=Math.hypot(a.x-b.x,a.y-b.y);diagAssert(err<1e-6,'Merkez sapması '+err);return 'Ekran farkı '+err.toFixed(6)+' piksel'}));
 diagCase('Açıölçer','Hizalı çizimde ölçek merkezi ve köşe',()=>diagSVG(angleFigure({angle:65,base:0,dir:1},{pro:true}),host=>{let svg=host.querySelector('svg'),c=host.querySelector('[data-role=center]'),v=[...svg.children].find(e=>e.tagName.toLowerCase()==='circle'&&+e.getAttribute('cx')===380&&+e.getAttribute('cy')===305);diagAssert(v&&c,'Köşe veya merkez eksik');let a=new DOMPoint(+c.getAttribute('cx'),+c.getAttribute('cy')).matrixTransform(c.getScreenCTM()),b=new DOMPoint(+v.getAttribute('cx'),+v.getAttribute('cy')).matrixTransform(v.getScreenCTM());diagAssert(Math.hypot(a.x-b.x,a.y-b.y)<1e-6,'Köşe ile merkez farklı');return 'Merkez köşeyle çakışıyor'}));
 diagCase('Pergel','Açıklık kilitliyken uç taşınması',()=>{let t={x:500,y:320,r:125,arm:0,locked:true};for(let p of [{x:800,y:400},{x:400,y:100},{x:505,y:322}]){let n=wbCompassNext(t,p);diagAssert(n.r===125,'Kilitli açıklık değişti')}return 'Üç farklı sürükleme konumunda r = 125 sabit'});
 diagCase('Pergel','Kilitsizken açıklığın güncellenmesi',()=>{let n=wbCompassNext({x:500,y:320,r:125,arm:0,locked:false},{x:600,y:320});diagAssert(Math.abs(n.r-100)<1e-8,'Açıklık yanlış');return 'Yeni yarıçap 100 model pikseli'});
 diagCase('Pergel','Yay çizilirken geçici açıklık kilidi',()=>{let n=wbCompassNext({x:500,y:320,r:80,arm:0,locked:false},{x:750,y:450},true);diagAssert(n.r===80,'Yay yarıçapı değişti');return 'Geçici kilit yarıçapı koruyor'});
 const fixture={points:[{id:'a',x:100,y:100,label:'A'},{id:'b',x:500,y:200,label:'B'},{id:'p',x:300,y:350,label:'P'}],objects:[{id:'l',type:'line',a:'a',b:'b'},{id:'per',type:'perpendicular',through:'p',base:'l'},{id:'par',type:'parallel',through:'p',base:'l'}],next:8};
 for(let moved of [false,true]){

 }
 diagCase('Çizgi motoru','Doğru / ışın kırpma ve kenar sınırları',()=>{for(let type of ['line','ray','segment'])for(let d of [[1,0],[0,1],[2,-5],[-6,-1]]){let l={a:{x:500,y:320},dx:d[0]*100,dy:d[1]*100,type},ends=wbClip(l);diagAssert(ends&&ends.every(p=>p.x>=-1e-7&&p.x<=1000+1e-7&&p.y>=-1e-7&&p.y<=640+1e-7),'Çizgi alan dışında')}return '12 yön / model bileşimi sınır içinde'});
 diagCase('Çizgi motoru','Kesişim koordinatı',()=>{let p=wbIntersection({a:{x:100,y:200},dx:500,dy:0,type:'line'},{a:{x:300,y:50},dx:0,dy:500,type:'line'});diagAssert(p&&Math.abs(p.x-300)<1e-8&&Math.abs(p.y-200)<1e-8,'Kesişim yanlış');return '(300, 200)'});
 diagCase('Dışa aktarma','SVG geçerli XML; sayısal alanlar sonlu',()=>{let svg=wbSVG(true),xml=new DOMParser().parseFromString(svg,'image/svg+xml');diagAssert(!xml.querySelector('parsererror'),'SVG XML hatası');diagAssert(!/NaN|Infinity|undefined/.test(svg),'Sonlu olmayan değer');return 'SVG ayrıştırıldı'});
 diagCase('Sınavlar','40 sınav ve 240 kayıt korunuyor',()=>{diagAssert(BANK.length===40&&BANK.reduce((s,e)=>s+e.questions.length,0)===240,'Sayılar değişmiş');return '20 açık uçlu + 20 test'});
 diagCase('Sınavlar','Soru türleri ve puan toplamları',()=>{for(let e of BANK){diagAssert(e.questions.reduce((s,q)=>s+q.points,0)===100,'Puan toplamı');if(e.mode==='mc')for(let q of e.questions)diagAssert(q.options.length===4&&new Set(q.options).size===4,'Şıklar');else for(let q of e.questions)diagAssert(!q.options,'Açık uçluda seçenek var')}return 'Her sınav 100 puan; türler ayrı'});
 diagCase('Sınavlar','Tüm soru görsellerinin sayısal üretimi',()=>{for(let e of BANK)for(let q of e.questions)diagAssert(!/NaN|Infinity|undefined/.test(figure(q.visual)),q.id+' görseli geçersiz');return '240 kayıt kontrol edildi'});
 diagCase('Mevcut belge','Noktalar ve geometrik referanslar',()=>{wbValid({version:1,doc:wbClone(W.doc)});return W.doc.points.length+' nokta, '+W.doc.objects.length+' şekil referansı geçerli'});
 let constraints=W.doc.objects.filter(o=>['perpendicular','parallel'].includes(o.type));if(!constraints.length)DREPORT.push({group:'Mevcut belge',name:'Çizilmiş dik / paralel ilişkileri',status:'skip',detail:'Belgede bu tür şekil yok; motor örnekleri ayrıca test edildi.'});
 else for(let o of constraints)diagCase('Mevcut belge',o.id+' '+o.type,()=>{let l=wbLine(o),b=wbLine(wbO(o.base));diagAssert(l&&b,'Boş ilişki');let err=o.type==='perpendicular'?l.dx*b.dx+l.dy*b.dy:l.dx*b.dy-l.dy*b.dx;diagAssert(Math.abs(err)<1e-6,'İlişki hatası '+err);return 'Bağımsız çarpım kontrolü '+err.toExponential(2)});
 diagCase('Arayüz','Bu test panelinde yatay taşma',()=>{diagAssert(document.documentElement.scrollWidth<=innerWidth+2,'Sayfa ekran genişliğini aşıyor');return innerWidth+' piksel görünümde taşma yok'});
 diagRender();return DREPORT;

function diagnostics(){nav('diagnostics');app.innerHTML=`<div class="row between"><div><span class="tag teal">GÖRÜNÜR DOĞRULAMA</span><h1>Geometrik doğruluk paneli</h1><p class="muted">Araç motoru, SVG merkezleri, sınav bankası ve mevcut çizim ayrı kontrol edilir.</p></div><div class="row"><button onclick="workbench()">Çizime dön</button><button class="primary" onclick="runDiagnostics()">Testleri yeniden çalıştır</button><button onclick="download('geometri-dogruluk-raporu.json',JSON.stringify({date:new Date().toISOString(),results:DREPORT},null,2))">Rapor indir</button></div></div><div class="notice warning">Yeşil sonuç yalnız adı yazılı sayısal / DOM koşulunun sağlandığını gösterir. Tüm görsel görünümün, her cihazın veya her kullanıcı hareketinin hatasız olduğu anlamına gelmez. Belgeniz bu testler sırasında değiştirilmez.</div><div id="diagSummary" class="stats"></div><section class="card"><div id="diagRows" class="tablewrap"></div></section><section class="card" style="margin-top:16px"><h3>Ne ölçülüyor, ne ölçülmüyor?</h3><p>Çizgi izdüşümleri, dik / paralel vektörler, kilitli pergel açıklığı, SVG merkez dönüşümleri ve verilerin tutarlılığı ölçülür. Dokunmatik ergonomi, yazıların her durumda çakışmaması, baskıdaki fiziksel santimetre ve bütün tarayıcıların davranışı bu testlerin dışında kalır.</p><p class="muted">Otomatik kısayolla oluşturulan dik / paralel nesneler bağlıdır. Serbest oluşturulmuş iki çizginin yanlışlığını sistem öğretmen yerine yorumlamaz; bu panel yalnız tanımlı koşulları doğrular.</p></section>`;runDiagnostics()}
function diagRender(){if(!$('diagRows'))return;let pass=DREPORT.filter(t=>t.status==='pass').length,fail=DREPORT.filter(t=>t.status==='fail').length,skip=DREPORT.filter(t=>t.status==='skip').length;$('diagSummary').innerHTML=`<div class="stat"><span>${DREPORT.length}</span><small>Kontrol</small></div><div class="stat"><span style="color:#187d61">${pass}</span><small>Başarılı</small></div><div class="stat"><span style="color:#b23e4c">${fail}</span><small>Hatalı</small></div><div class="stat"><span>${skip}</span><small>Örnek yok / uygulanmadı</small></div>`;$('diagRows').innerHTML=`<table><thead><tr><th>Alan</th><th>Kontrol</th><th>Sonuç</th><th>Ölçüm / açıklama</th></tr></thead><tbody>${DREPORT.map(t=>`<tr><td>${esc(t.group)}</td><td>${esc(t.name)}</td><td><span class="tag ${t.status==='pass'?'good':t.status==='fail'?'bad':'amber'}">${t.status==='pass'?'Başarılı':t.status==='fail'?'Hatalı':'Uygulanmadı'}</span></td><td>${esc(t.detail)}</td></tr>`).join('')}</tbody></table>`}
